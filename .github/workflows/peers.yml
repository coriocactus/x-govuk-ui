name: Peers

# The packages take Base UI and Motion as peers, at the ranges in core's package.json. Every other
# check runs with the lowest version of each range. Each day, this checks whether either has a newer
# version within its range. If one has, it runs the static checks and the behaviour tests in every
# engine with it. A failure means a published range admits a version that breaks the library, so
# the next release should fix the library or narrow the range.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      patches: ${{ steps.newer.outputs.patches }}
      playwright: ${{ steps.newer.outputs.playwright }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: --locked
      - id: newer
        run: |
          set -o pipefail
          patches=$(bun scripts/peers.ts newer | tr '\n' ' ')
          echo "${patches:-No newer versions.}"
          echo "patches=$patches" >> "$GITHUB_OUTPUT"
          echo "playwright=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

  # In Playwright's own image, as the browser checks run, as the runner's user. Each engine has a job
  # of its own, because a peer can break one engine alone.
  test:
    needs: newer
    if: needs.newer.outputs.patches != ''
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.newer.outputs.playwright }}-noble
      options: --user 1001
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: --locked
      - run: bun scripts/peers.ts use
      - run: bun install
      - run: bun run check:static
      - run: bunx --bun playwright test --project ${{ matrix.project }}
