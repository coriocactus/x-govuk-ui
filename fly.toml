# The site on Fly.io, as one small machine that sleeps when no one visits and wakes on the next request.
app = "x-govuk-ui"
primary_region = "lhr"

# A deploy starts a new machine beside the old one and moves the traffic to it once its health
# check passes, so a build that fails to start never replaces the one serving the site.
[deploy]
  strategy = "bluegreen"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
