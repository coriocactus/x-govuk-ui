name: Check

# Pushes to main and pull requests, each checked once, and runs by hand from the Actions tab. The
# first job works out what a change touches, instead of a paths filter. Main is pushed as one
# squashed commit, a history unrelated to the last, and GitHub runs no path-filtered workflow at
# all for such a push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run it supersedes, which checks
# a commit no longer at the tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether the change touches anything the checks read. If it does not, as for a change to only the
  # README, the licence or the deployment, the checks show as skipped. If it cannot be told, as for
  # a run by hand, a branch's first push or a commit GitHub no longer has, everything is checked.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checked: ${{ steps.diff.outputs.checked }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Playwright that package.json pins, whose image the browser checks run in.
      - id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          # The pull request's base, or the commit before the push.
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # What the checks read. A file they start to read joins the list.
          CHECKED: |
            packages
            site
            mcp
            scripts
            tests
            package.json
            bun.lock
            bunfig.toml
            tsconfig.json
            tsconfig.lib.json
            biome.json
            playwright.config.ts
            mise.toml
            mise.lock
            THIRD_PARTY_NOTICES.txt
            .github/workflows/check.yml
        run: |
          # By hand, or a branch's first push, for which GitHub sends zeros as the commit before.
          unknown() { [ "$EVENT" = workflow_dispatch ] || [ -z "${BEFORE//0}" ]; }

          if unknown || ! git fetch --quiet --no-tags --depth=1 origin "$BEFORE"; then
            echo "The change cannot be told, so everything is checked."
            echo "checked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The list splits into one path each, so it is not quoted.
          # shellcheck disable=SC2086
          changed=$(git diff --name-only "$BEFORE" HEAD -- $CHECKED)
          echo "${changed:-Nothing the checks read has changed.}"
          echo "checked=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Formatting, lint, types, server rendering and the build, in under a minute.
  static:
    needs: changes
    if: needs.changes.outputs.checked == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: --locked
      - run: bun install --frozen-lockfile
      - run: bun run check:static

  # The browser checks, each Playwright project in shards. A public repository's runner has four
  # CPUs, and Playwright starts a worker for every two, so each job runs two workers. GitHub's Free
  # plan runs 20 jobs at a time, which are these 19 and the static checks. Each project has as many
  # shards as its share of the work, as a run measured it, so they all finish together.
  #
  # They run in Playwright's own image, at the version package.json pins, which contains the
  # browsers and the system packages they need. Installing those in each job, nineteen jobs at once,
  # sometimes stalls on Ubuntu's package mirrors. The image runs as the runner's user, as
  # Playwright's guide for GitHub Actions does, because Firefox will not run as root in another
  # user's home.
  browser:
    needs: changes
    if: needs.changes.outputs.checked == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      options: --user 1001
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: sweep-chromium, shard: 1/5 }
          - { project: sweep-chromium, shard: 2/5 }
          - { project: sweep-chromium, shard: 3/5 }
          - { project: sweep-chromium, shard: 4/5 }
          - { project: sweep-chromium, shard: 5/5 }
          - { project: sweep-webkit, shard: 1/3 }
          - { project: sweep-webkit, shard: 2/3 }
          - { project: sweep-webkit, shard: 3/3 }
          - { project: chromium, shard: 1/3 }
          - { project: chromium, shard: 2/3 }
          - { project: chromium, shard: 3/3 }
          - { project: firefox, shard: 1/3 }
          - { project: firefox, shard: 2/3 }
          - { project: firefox, shard: 3/3 }
          - { project: webkit, shard: 1/5 }
          - { project: webkit, shard: 2/5 }
          - { project: webkit, shard: 3/5 }
          - { project: webkit, shard: 4/5 }
          - { project: webkit, shard: 5/5 }
    name: ${{ matrix.project }} ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: --locked
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx --bun playwright test --project ${{ matrix.project }} --shard ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 3
